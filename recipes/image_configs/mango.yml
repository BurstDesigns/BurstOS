# MANGO configuration for BurstOS images

modules:

  - type: dnf
    install:
      packages:
        - mangowm

  - type: dnf
    repos:
      copr:
        - duxlabs/dms-git
      cleanup: true
    install:
      packages:
        - dux-greeter-git
        - dms
        - dankcalendar-git
        - dux-files-git

  - type: dnf
    repos:
      copr:
        - blakegardner/xremap
      cleanup: true
    install:
      packages:
        - xremap

  - type: dnf
    install:
      packages:
        - kf6-kimageformats
        - gnome-keyring
        - gnome-keyring-pam
        - gcr
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-wlr
        # - wayvnc # broken in Fedora 44-45 on nvidia
        - nautilus
        # - ptyxis
        - sushi
        - zenity
        - power-profiles-daemon
        - cups-pk-helper
        - pcre # for arbtt-stats

  - type: dnf
    repos:
      copr:
        - "@nightdrive/nightdrive"
      cleanup: true
    install:
      packages:
        - wayvnc

  # Issue #78 waiting for fix
  # - type: dnf
  #   repos:
  #     nonfree: rpmfusion
  #     cleanup: true
  #   install:
  #     packages:
  #       - lamco-rdp-server
  #       # - openh264 ## ??

  - type: files
    files:
      - source: mango
        destination: /
