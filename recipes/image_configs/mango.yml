# MANGO configuration for BurstOS images

modules:

  - type: dnf
    install:
      packages:
        - mangowm

  - type: dnf
    repos:
      copr:
        - duxlabs/dms-git
      cleanup: true
    install:
      packages:
        - dux-greeter-git
        - dms
        - dankcalendar-git
        - dux-files-git

  - type: dnf
    repos:
      copr:
        - blakegardner/xremap
      cleanup: true
    install:
      packages:
        - xremap

  - type: dnf
    install:
      packages:
        - kf6-kimageformats
        - gnome-keyring
        - gnome-keyring-pam
        - gcr
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - nautilus
        # - ptyxis
        - sushi
        - zenity
        - power-profiles-daemon
        - cups-pk-helper
        - pcre # for arbtt-stats

  - type: dnf
    install:
      packages:
        - https://github.com/lamco-admin/lamco-rdp-server/releases/download/v1.4.5/lamco-rdp-server-1.4.5-1.fc44.src.rpm

  - type: files
    files:
      - source: mango
        destination: /
