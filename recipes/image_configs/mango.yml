# MANGO configuration for BurstOS images

modules:

  - type: dnf
    repos:
      copr:
        - avengemedia/dms-git
        - avengemedia/danklinux
        - blakegardner/xremap
        - kaleedtc/mangowm
      cleanup: true
    install:
      packages:
        - zenity
        - dms-greeter-git
        - gnome-keyring
        - gnome-keyring-pam
        - gcr
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-gnome
        - nautilus
        - ptyxis
        - sushi
        - dms
        - dankcalendar-git
        - xremap
        - mangowm

  - type: files
    files:
      - source: mango
        destination: /
