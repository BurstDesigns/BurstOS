# Base configuration for every BurstOS images

modules:
  - type: files
    files:
      - source: common
        destination: /

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add "Nerd Font" suffix.
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Fira Sans

  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      cleanup: true
    install:
      packages:
        - tailscale

  - type: dnf
    repos:
      copr:
        - alternateved/bleeding-emacs
      cleanup: true
    install:
      packages:
        - emacs-pgtk

  - type: dnf
    repos:
      copr:
        - phrdina/cyrus-sasl-xoauth2
      cleanup: true
    install:
      packages:
        - cyrus-sasl-xoauth2


  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - terra-release

  - type: dnf
    install:
      packages:
        - ghostty

  - type: dnf
    install:
      packages:
        - python3-msal
        - python3-pyxdg
        - python3-gnupg

  - type: script
    snippets:
      - "curl -fsSL https://github.com/dsh2dsh/goimapnotify/releases/download/v2.8.1/goimapnotify_2.8.1_linux_amd64.tar.gz -o /tmp/gin.tar.gz && tar -xzf /tmp/gin.tar.gz -C /tmp && install -m 0755 /tmp/goimapnotify /usr/bin/goimapnotify && rm -f /tmp/goimapnotify /tmp/gin.tar.gz"
      - "curl -fsSL https://github.com/harishkrupo/oauth2ms/raw/main/oauth2ms -o /usr/bin/oauth2ms && chmod 0755 /usr/bin/oauth2ms"

  - type: dnf
    install:
      packages:
        - emacs-notmuch
        - notmuch
        - yq
        - isync
        - msmtp
        - mpv
        - git-lfs
        - tailscale
        - yt-dlp
        - ripgrep
        - cockpit
        - cockpit-podman
    remove:
      auto-remove: false
      packages:
        - firefox # default firefox removed in favor of flatpak
        - firefox-langpacks # langpacks needs to also be removed to prevent dependency problems

  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.mozilla.firefox
      - scope: user
        install:
          - org.keepassxc.KeePassXC
          - com.github.zocker_160.SyncThingy
          - org.mozilla.Thunderbird
          - org.onlyoffice.desktopeditors
          - com.discordapp.Discord

  - type: signing
