# NIRI configuration for BurstOS images

modules:

  - type: dnf
    repos:
      copr:
        - yalter/niri
        - avengemedia/dms-git
        - avengemedia/danklinux
        # - zhangyi6324/noctalia-shell
        - blakegardner/xremap
    install:
      packages:
        - zenity
        - xremap-niri
        - niri
        # - noctalia-shell
        - dms
        - dankcalendar-git
      exclude:
        - alacritty
        - waybar
        - fuzzel
