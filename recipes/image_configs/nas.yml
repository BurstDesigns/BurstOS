# Tailscale configuration for BurstOS images

modules:

  - type: dnf
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      cleanup: true
    install:
      packages:
        - tailscale

  - type: dnf
    install:
      packages:
        - lm_sensors
        - cockpit
        - cockpit-files
        - cockpit-kdump
        - cockpit-networkmanager
        - cockpit-podman
        - cockpit-selinux
        - cockpit-storaged
        - cockpit-system
        - cockpit-ostree
        - cockpit-sosreport
        - mdadm
        - pcp
        - podman
        - samba
        - smartmontools
        - nfs-utils
        - node-exporter
        - prometheus
        - rclone
        - sg3_utils
        - ethtool
        - iperf3
        - fail2ban
        - lsscsi

  - type: script
    snippets:
      - "curl -fsSL https://github.com/EasyTier/EasyTier/releases/download/v2.7.1/easytier-linux-x86_64-v2.7.1.zip -o /tmp/ezt.zip && unzip -j /tmp/ezt.zip -d /tmp/ezt && install -m 0755 /tmp/ezt/easytier-cli /usr/bin/easytier-cli && install -m 0755 /tmp/ezt/easytier-core /usr/bin/easytier-core && rm -rf /tmp/ezt.zip /tmp/ezt"


  # - type: files
  #   files:
  #     - source: nas # systemd presets, services, udev rules
  #       destination: /
